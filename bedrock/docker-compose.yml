# Local Bedrock server (Dragonfly). API must run separately.
# Usage: docker compose up -d --build

name: campusworld-bedrock

volumes:
  bedrock_world:
  bedrock_players:

services:
  bedrock:
    build: .
    restart: unless-stopped
    ports:
      - "19132:19132/udp"
    environment:
      CAMPUS_API_URL: ${CAMPUS_API_URL:-http://host.docker.internal:8080}
      PLUGIN_API_KEY: ${PLUGIN_API_KEY:-dev-plugin-key}
      SERVER_SLUG: ${SERVER_SLUG:-bedrock}
      SERVER_NAME: ${SERVER_NAME:-CampusWorld Bedrock}
    volumes:
      - bedrock_world:/app/world
      - bedrock_players:/app/players
